[package]
name = "git-imerge"
version = "0.1.0"
edition = "2021"
description = "Incremental merge and rebase for Git (Rust port of git-imerge)"
license = "GPL-2.0-or-later"

[[bin]]
name = "git-imerge"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
regex = "1"
